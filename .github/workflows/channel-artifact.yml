name: channel-artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-64
            runner: ubuntu-latest
            c_compiler: gcc
          - target: osx-arm64
            runner: macos-latest
            c_compiler: clang
          - target: win-64
            runner: windows-latest
            c_compiler: vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.69.0
          run-install: true

      - name: Build package
        shell: bash
        run: |
          set -euxo pipefail
          pixi run rattler-build build \
            --recipe recipe \
            --output-dir output \
            --channel conda-forge \
            --target-platform "${{ matrix.target }}" \
            --variant "c_compiler=${{ matrix.c_compiler }}" \
            --test native \
            --package-format conda \
            --log-style plain

      - name: Stage package artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          cp output/${{ matrix.target }}/*.conda package/
          ls -la package

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: package/*.conda
          if-no-files-found: error

  index-and-upload:
    name: Index and upload channel
    needs: build
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-channel.outputs.artifact-id }}
      artifact-url: ${{ steps.upload-channel.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.69.0
          run-install: true

      - name: Download built packages into channel subdirs
        uses: actions/download-artifact@v4
        with:
          name: package-linux-64
          path: channel/linux-64

      - name: Download macOS package into channel subdir
        uses: actions/download-artifact@v4
        with:
          name: package-osx-arm64
          path: channel/osx-arm64

      - name: Download Windows package into channel subdir
        uses: actions/download-artifact@v4
        with:
          name: package-win-64
          path: channel/win-64

      - name: Index channel
        shell: bash
        run: |
          set -euxo pipefail
          find channel -maxdepth 3 -type f -print | sort
          pixi run rattler-index fs --force channel
          find channel -maxdepth 3 -type f -print | sort

      - name: Upload indexed channel root
        id: upload-channel
        uses: actions/upload-artifact@v4
        with:
          name: conda-channel
          path: channel
          if-no-files-found: error

  push-oci-channel:
    name: Push channel to GHCR OCI
    needs: index-and-upload
    runs-on: ubuntu-latest
    outputs:
      oci-base: ${{ steps.push.outputs.oci-base }}
      fake-channel: ${{ steps.push.outputs.fake-channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.69.0
          run-install: true

      - name: Download final channel artifact
        uses: actions/download-artifact@v4
        with:
          name: conda-channel
          path: channel

      - name: Push OCI artifacts
        id: push
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          shopt -s nullglob

          oci_base="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-channel"
          fake_channel="https://artifact-channel.invalid/${{ github.event.repository.name }}"
          echo "oci-base=oci://${oci_base}" >> "$GITHUB_OUTPUT"
          echo "fake-channel=${fake_channel}" >> "$GITHUB_OUTPUT"

          echo "${GHCR_TOKEN}" | pixi run oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          push_repodata() {
            local subdir="$1"
            local ref="${oci_base}/${subdir}/repodata.json:latest"
            local layers=()
            if [[ -f "channel/${subdir}/repodata.json" ]]; then
              layers+=("channel/${subdir}/repodata.json:application/vnd.conda.repodata.v1+json")
            fi
            if [[ -f "channel/${subdir}/repodata.json.zst" ]]; then
              layers+=("channel/${subdir}/repodata.json.zst:application/vnd.conda.repodata.v1+json+zst")
            fi
            if [[ ${#layers[@]} -gt 0 ]]; then
              pixi run oras push "${ref}" "${layers[@]}"
            fi
          }

          push_packages() {
            local subdir="$1"
            for pkg in channel/${subdir}/*.conda; do
              local filename stem build rest version name tag ref
              filename="$(basename "${pkg}")"
              stem="${filename%.conda}"
              build="${stem##*-}"
              rest="${stem%-*}"
              version="${rest##*-}"
              name="${rest%-*}"
              tag="${version}-${build}"
              tag="${tag//+/__p__}"
              tag="${tag//!/__e__}"
              tag="${tag//=/__eq__}"
              ref="${oci_base}/${subdir}/${name}:${tag}"
              pixi run oras push "${ref}" "${pkg}:application/vnd.conda.package.v2"
            done
          }

          for subdir in noarch linux-64 osx-arm64 win-64; do
            push_repodata "${subdir}"
            push_packages "${subdir}"
          done

  verify-oci:
    name: Verify OCI ${{ matrix.target }}
    needs: push-oci-channel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-64
            runner: ubuntu-latest
          - target: osx-arm64
            runner: macos-latest
          - target: win-64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.69.0
          run-install: true

      - name: Install and run probe from GHCR OCI mirror
        shell: bash
        run: |
          set -euxo pipefail
          mkdir oci-pixi-test
          cd oci-pixi-test
          cat > pixi.toml <<EOF
          [workspace]
          channels = ["${{ needs.push-oci-channel.outputs.fake-channel }}"]
          platforms = ["${{ matrix.target }}"]

          [dependencies]
          artifact-channel-probe = "*"
          EOF
          mkdir -p .pixi
          cat > .pixi/config.toml <<EOF
          [repodata-config]
          disable-sharded = true

          [mirrors]
          "${{ needs.push-oci-channel.outputs.fake-channel }}" = ["${{ needs.push-oci-channel.outputs.oci-base }}"]
          EOF
          pixi install
          pixi run artifact-channel-probe

  direct-artifact-negative-probe:
    name: Direct artifact URL negative probe
    needs: index-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.69.0
          run-install: true

      - name: Show artifact URLs
        shell: bash
        run: |
          echo "artifact-url=${{ needs.index-and-upload.outputs.artifact-url }}"
          echo "artifact-api-zip=https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ needs.index-and-upload.outputs.artifact-id }}/zip"

      - name: Prove artifact zip URL is not a conda channel
        shell: bash
        run: |
          set -euxo pipefail
          artifact_api_zip="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ needs.index-and-upload.outputs.artifact-id }}/zip"
          set +e
          pixi run rattler create \
            --prefix direct-artifact-env \
            --channel "${artifact_api_zip}" \
            --channel conda-forge \
            artifact-channel-probe 2>&1 | tee direct-artifact.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "Unexpected success: the artifact zip URL behaved like a conda channel."
            exit 1
          fi
          grep -E "failed to load repodata|zip/.*/repodata\\.json|could not find subdir" direct-artifact.log

  verify:
    name: Verify ${{ matrix.target }}
    needs: index-and-upload
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-64
            runner: ubuntu-latest
          - target: osx-arm64
            runner: macos-latest
          - target: win-64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.69.0
          run-install: true

      - name: Download final channel artifact
        uses: actions/download-artifact@v4
        with:
          name: conda-channel
          path: downloaded-channel

      - name: Inspect downloaded layout
        shell: bash
        run: |
          set -euxo pipefail
          find downloaded-channel -maxdepth 3 -type f -print | sort
          test -f downloaded-channel/${{ matrix.target }}/repodata.json
          test -f downloaded-channel/noarch/repodata.json

      - name: Install and run probe from downloaded channel
        shell: bash
        run: |
          set -euxo pipefail
          pixi run rattler create \
            --prefix probe-env \
            --channel ./downloaded-channel \
            --channel conda-forge \
            artifact-channel-probe
          pixi run rattler run --prefix probe-env artifact-channel-probe
